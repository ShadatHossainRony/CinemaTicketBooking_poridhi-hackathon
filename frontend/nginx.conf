# Served INSIDE the frontend container by nginx:alpine.
#
# This is NOT nginx/cinemaseat.conf (the host config) — that one
# terminates TLS, holds the ACME challenge location, and routes API
# paths to the api/api2 upstream. This one only serves the built SPA.
# Host Nginx proxies `location /` to this container over the loopback
# interface; from this container's point of view it is a plain,
# ordinary static-file server on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # Hashed filenames (Vite's build output) are safe to cache forever —
    # a content change produces a new filename, never a mutated old one.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve the file if it exists, else index.html so a
    # deep link doesn't 404. There is no client-side router today
    # (06-frontend-plan.md §2 — the API is mounted at the root, so a UI
    # route would collide with it), but this keeps a hard refresh on any
    # path safe regardless.
    location / {
        try_files $uri /index.html;
    }
}
