# Nginx server block for CinemaSeat.
#
# Routes the SINGLE public hostname to BOTH the SPA and the API.
# The API lives at the ROOT (no /api prefix), so we use a path-segment
# allow-list (a regex match on the first segment) and `try_files` for
# everything else (the SPA).
#
# /payments/callback is NOT routed here on purpose — it is reachable
# only from inside the Docker network, which is the callback-forgery
# control (REQ-13 / 09-security-hardening §T-04).

upstream cinemaseat_api {
    # Two API replicas; Nginx health-checks via /health.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Path-segment allow-list: these exact first segments are routed to the API.
# Everything else falls through to the SPA `try_files` rule.
map $request_uri $is_api_request {
    default                       0;
    ~^/(health|ready|movies|theatres|shows|holds|bookings|docs|openapi.json)(/|$)  1;
}

# --- HTTPS server (managed by Certbot on the VM) ---------------------------
server {
    listen 443 ssl http2;
    server_name poridhi-hackathon.shadathossainrony.dev;

    ssl_certificate     /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (REQ-48 / 09-security-hardening §4).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'" always;

    # ACME http-01 challenge (Certbot renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static SPA assets.
    root /var/www/cinemaseat;
    index index.html;

    # Optional: gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # API: routed via the allow-list map.
    location / {
        if ($is_api_request = 1) {
            # API path — proxy to upstream with permissive body for /holds.
            proxy_pass http://cinemaseat_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 30s;
            client_max_body_size 64k;
        }

        # SPA fallback: serve index.html for unknown paths.
        try_files $uri $uri/ /index.html;
    }

    # /health is hit by uptime monitors — keep it out of the access log.
    location = /health {
        access_log off;
        proxy_pass http://cinemaseat_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward the request id from Nginx (optional; the API mints one if absent).
    # `map` + `proxy_set_header X-Request-ID $request_id;` requires the
    # `req_id` module — on stock Nginx builds the API always mints its own.
}

# --- HTTP → HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name poridhi-hackathon.shadathossainrony.dev;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}