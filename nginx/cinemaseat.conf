# Nginx server block for CinemaSeat.
#
# Routing model:
#
#   /health /ready /movies /theatres /shows /holds /bookings /docs /openapi.json
#         → reverse-proxied to the API (FastAPI). The path is forwarded
#           as-is — the upstream sees its own root-level routes, which
#           is what CLAUDE.md / REQ-18 / REQ-20 require.
#
#   /payments/callback
#         → NOT routed. The gateway is the only legitimate caller; it's
#           reachable only from inside the Docker network. This is the
#           callback-forgery control (REQ-13).
#
#   /*   → SPA fallback. `try_files` serves the static asset if it exists,
#           otherwise /index.html so client-side routes work. Today the
#           frontend is a single-page app; tomorrow it may grow into a
#           multi-page app — adding /booking/... or /admin/... is a
#           frontend-only change.
#
# Why per-prefix `location` blocks instead of `location /api/`:
#   CLAUDE.md pins the API at the root with no /api or /v1 prefix
#   (REQ-18 quotes `GET /health` literally). A prefix would silently
#   break every existing test and judge-facing curl example.
#
# Why not `if ($is_api_request)`:
#   The `if` directive at the location level is "evil" — many directives
#   (`proxy_http_version`, `add_header`, `return`, `rewrite`) refuse to
#   work inside it. Per-prefix `location` blocks side-step the whole
#   problem and are the documented Nginx idiom.

upstream cinemaseat_api {
    # Two API replicas; Nginx health-checks via /health.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- HTTPS server (managed by Certbot on the VM) ---------------------------
server {
    listen 443 ssl http2;
    server_name poridhi-hackathon.shadathossainrony.dev;

    ssl_certificate     /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (REQ-48 / 09-security-hardening §4).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'" always;

    # ACME http-01 challenge (Certbot renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static SPA assets. The frontend image is build-only (never run —
    # see the `build-only` profile on docker-compose.yml's `frontend`
    # service). deploy.sh / `make build-frontend` extract its built
    # /dist with `docker create` + `docker cp` and rsync it here.
    # No bind mount: a host bind mount replaces a container directory
    # with the host path's content rather than merging with it, so it
    # can never be pre-populated from what the image baked into /dist —
    # that auto-populate behaviour only exists for named volumes. See
    # frontend/Dockerfile and DECISIONS.md.
    #
    # We point Nginx's root directly at /srv/cinemaseat-dist so the
    # SPA is served at / (REQ-1: single-page app at root). When the
    # directory is empty (first boot, before `make build-frontend` /
    # deploy.sh has run), the `@spa_missing` named location below
    # returns a clear 503 instead of an Nginx 403.
    root /srv/cinemaseat-dist;
    index index.html;

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---- API: per-prefix location blocks. Each one matches the prefix
    # exactly (with $), so /movies and /movies/ both match but
    # /movies-thing doesn't.

    location = /health {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/ready(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/movies(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/theatres(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/shows(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/holds(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/bookings(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/docs(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location = /openapi.json {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }

    # ---- SPA fallback ----------------------------------------------
    # Anything that didn't match an API prefix above lands here.
    # try_files serves the asset if it exists, else the SPA's index.html.
    #
    # If /srv/cinemaseat-dist is empty (frontend container not running,
    # bind mount empty), try_files falls through to /index.html which
    # Nginx won't find — that yields a confusing 403. The @spa_missing
    # named location catches that and returns a clear 503 with an
    # actionable message instead.
    location / {
        try_files $uri $uri/ /index.html @spa_missing;
    }

    location @spa_missing {
        default_type text/plain;
        return 503 "SPA not built yet — run: docker compose up -d --build frontend\n";
    }
}

# --- HTTP → HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name poridhi-hackathon.shadathossainrony.dev;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}