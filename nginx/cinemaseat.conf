# Nginx server block for CinemaSeat.
#
# Routing model:
#
#   /health /ready /movies /theatres /shows /holds /bookings /docs /openapi.json
#         → reverse-proxied to the API (FastAPI). The path is forwarded
#           as-is — the upstream sees its own root-level routes, which
#           is what CLAUDE.md / REQ-18 / REQ-20 require.
#
#   /payments/callback
#         → NOT routed. The gateway is the only legitimate caller; it's
#           reachable only from inside the Docker network. This is the
#           callback-forgery control (REQ-13).
#
#   /*   → reverse-proxied to the frontend container (nginx:alpine
#           serving the built SPA — frontend/nginx.conf owns the
#           try_files/index.html fallback on its side). Host Nginx does
#           not read the frontend's files from disk; it proxies to it
#           exactly like it proxies API paths to api/api2.
#
# Why per-prefix `location` blocks instead of `location /api/`:
#   CLAUDE.md pins the API at the root with no /api or /v1 prefix
#   (REQ-18 quotes `GET /health` literally). A prefix would silently
#   break every existing test and judge-facing curl example.
#
# Why not `if ($is_api_request)`:
#   The `if` directive at the location level is "evil" — many directives
#   (`proxy_http_version`, `add_header`, `return`, `rewrite`) refuse to
#   work inside it. Per-prefix `location` blocks side-step the whole
#   problem and are the documented Nginx idiom.

upstream cinemaseat_api {
    # Two API replicas; Nginx health-checks via /health.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream cinemaseat_frontend {
    # The frontend container — a normal compose service (nginx:alpine
    # serving the built SPA), not a directory we read from disk. Same
    # upstream pattern as the API, so scaling it out later (a second
    # frontend replica) is a one-line change here, exactly like api2 was.
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
}

# --- HTTPS server (managed by Certbot on the VM) ---------------------------
server {
    listen 443 ssl http2;
    server_name poridhi-hackathon.shadathossainrony.dev;

    ssl_certificate     /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/poridhi-hackathon.shadathossainrony.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (REQ-48 / 09-security-hardening §4).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'" always;

    # ACME http-01 challenge (Certbot renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # gzip applies to whatever this server proxies — both the API's JSON
    # and (redundantly but harmlessly) the frontend container's already-
    # gzipped assets. `gzip_proxied any` is required for it to apply to
    # proxied responses at all; nginx correctly skips re-compressing
    # anything that already arrives with Content-Encoding: gzip.
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---- API: per-prefix location blocks. Each one matches the prefix
    # exactly (with $), so /movies and /movies/ both match but
    # /movies-thing doesn't.

    location = /health {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/ready(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/movies(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/theatres(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/shows(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/holds(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/bookings(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location ~ ^/docs(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }
    location = /openapi.json {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_api;
    }

    # ---- SPA: everything not matched by an API prefix above lands here.
    # Proxied to the frontend container, not served from a directory —
    # the container owns its own try_files/index.html fallback
    # (frontend/nginx.conf). If the container isn't up, this behaves
    # exactly like a backend outage does: a 502, not a silent empty page.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://cinemaseat_frontend;
    }
}

# --- HTTP → HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name poridhi-hackathon.shadathossainrony.dev;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}